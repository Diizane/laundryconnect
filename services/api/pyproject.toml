[project]
name = "laundryconnect-api"
version = "0.1.0"
description = "LaundryConnect backend API — unified technical knowledge platform for commercial laundry technicians"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29",
    "pypdf>=5.0,<7.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12,<5.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]
# Operator-only: the manual session bootstrap (visible browser). NOT needed
# by the API runtime, tests, or CI. Requires `playwright install chromium`.
bootstrap = [
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "SIM", # simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101: assert is expected in tests.
# S105/S106: redaction tests use deliberate fake credentials.
# S603/S607: worker-lifecycle tests assert on child processes via
# fixed-argv pgrep/ps — no untrusted input reaches the shell.
"app/tests/**" = ["S101", "S105", "S106", "S603", "S607"]
