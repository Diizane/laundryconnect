name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API tests and linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      # The Docker image installs from requirements.txt while development
      # and CI use pyproject.toml. A dependency added to one but not the
      # other builds fine and then crashes on deploy (this happened with
      # `cryptography`), so drift is a CI failure.
      - name: requirements.txt matches pyproject.toml
        run: |
          uv pip compile pyproject.toml -o /tmp/requirements.check.txt --quiet
          diff -u requirements.txt /tmp/requirements.check.txt || {
            echo "::error::requirements.txt is out of date — run: uv pip compile pyproject.toml -o requirements.txt"
            exit 1
          }

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Tests (pytest)
        run: uv run pytest -v

  mobile:
    name: Mobile analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      - name: Tests
        run: flutter test
